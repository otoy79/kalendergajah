<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kalendergajah.pages.dev/musik/musik/religi.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #ff9f43; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        .tiktok-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .tiktok-container::-webkit-scrollbar { display: none; }

        .slide {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(360deg, #ff9f43 0%, #ffffff 100%);
            color: white;
            text-align: center;
        }

        .album-art {
            width: 240px; height: 240px;
            border-radius: 50%;
            border: 8px solid rgba(255, 255, 255, 0.4);
            background: url('https://kalendergajah.pages.dev/musik/musik/disc.png') no-repeat center;
            background-size: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }

        .playing .album-art { animation: rotateDisk 12s linear infinite; }
        @keyframes rotateDisk { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .song-info h2 { font-size: 18px; margin-bottom: 5px; padding: 0 10px; }
        .song-info p { font-size: 14px; opacity: 0.8; }

        .timer-box { font-size: 12px; margin-top: 15px; font-family: monospace; }
        .progress-container {
            width: 70%; height: 5px;
            background: rgba(255,255,255,0.3);
            margin-top: 10px; border-radius: 10px; overflow: hidden;
        }
        .progress-bar { width: 0%; height: 100%; background: #fff; }

        .btn-play-pause {
            margin-top: 25px; width: 60px; height: 60px;
            border-radius: 50%; border: none;
            background: white; color: #ee5253;
            font-size: 24px; display: flex;
            justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: white; z-index: 100;
            display: flex; justify-content: center; align-items: center;
            text-align: center; font-weight: bold;
        }
  .logo {
            position: absolute;
            bottom: 30px;
            left: 25px;
            color: rgba(0,0,0,0.9);
            padding:10px;
            font-weight: bold;
            z-index: 5;
            width: 100px; height: 30px;
            background: url('https://kalendergajah.pages.dev/musik/musik/reltok.png') no-repeat center;
            background-size: cover;
            
        }
    </style>
</head>
<body>

<div id="start-overlay" onclick="mulaiAplikasi()">
   <div>
       <span style="font-size: 40px;">🎵</span><br><span style="font-size: 12px;">KLIK UNTUK MULAI
  <br>SCROLL ke Keatas untuk pilihan Lagu</span>
   </div>
</div>

<div class="tiktok-container" id="playerWrapper"></div>

<script>
    const wrapper = document.getElementById('playerWrapper');
    const baseURL = "https://kalendergajah.pages.dev/musik/musik/";
    let laguAcak = [];

    // 1. Fungsi Shuffle (Acak)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function renderPlayer() {
        if (typeof religiSongs !== 'undefined') {
            // Kita acak datanya
            laguAcak = shuffleArray([...religiSongs]);

            laguAcak.forEach((song, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.id = `slide-${index}`;
                slide.innerHTML = `
                    <div class="album-art"></div>
    <div class="logo"></div>
                    <div class="song-info">
                        <h2>${song.title.replace(/_/g, ' ')}</h2>
                        <p>${song.artist}</p>
                    </div>
                    <div class="timer-box">
                        <span id="current-${index}">0:00</span> / <span id="duration-${index}">0:00</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="pb-${index}"></div>
                    </div>
                    <button class="btn-play-pause" onclick="manualToggle(${index})">
                        <span id="icon-${index}">|▶</span>
                    </button>
                    <audio id="audio-${index}" src="${baseURL}${song.url}" preload="none"></audio>
                `;
                wrapper.appendChild(slide);

                const audio = document.getElementById(`audio-${index}`);
                
                // --- FIX AUTO NEXT SAAT LOCKSCREEN ---
                audio.onended = () => {
                    const nextIndex = index + 1;
                    const nextAudio = document.getElementById(`audio-${nextIndex}`);
                    const nextSlide = document.getElementById(`slide-${nextIndex}`);
                    
                    if (nextSlide) {
                        // Scroll visual (jalan kalau layar nyala)
                        nextSlide.scrollIntoView({ behavior: 'smooth' });
                        // Paksa putar suara (jalan meskipun layar mati)
                        nextAudio.play().catch(e => console.log("Gagal auto-play:", e));
                    } else {
                        // Balik ke lagu pertama kalau sudah habis
                        document.getElementById('slide-0').scrollIntoView({ behavior: 'smooth' });
                        document.getElementById('audio-0').play();
                    }
                };

                // --- FIX TOMBOL IKON AGAR SELALU UPDATE ---
                audio.onplay = () => {
                    document.getElementById(`icon-${index}`).innerText = "◼️";
                    document.getElementById(`slide-${index}`).classList.add('playing');
                };
                audio.onpause = () => {
                    document.getElementById(`icon-${index}`).innerText = "|▶";
                    document.getElementById(`slide-${index}`).classList.remove('playing');
                };
            });
            initObserver();
        }
    }

    function formatTime(secs) {
        let min = Math.floor(secs / 60);
        let sec = Math.floor(secs % 60);
        return min + ":" + (sec < 10 ? "0" + sec : sec);
    }

    function manualToggle(idx) {
        const audio = document.getElementById(`audio-${idx}`);
        if (audio.paused) { audio.play(); } 
        else { audio.pause(); }
    }

    function initObserver() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const idx = entry.target.id.split('-')[1];
                const audio = document.getElementById(`audio-${idx}`);
                const pb = document.getElementById(`pb-${idx}`);
                const curT = document.getElementById(`current-${idx}`);
                const durT = document.getElementById(`duration-${idx}`);

                if (entry.isIntersecting) {
                    audio.play().catch(() => {});
                    
                    audio.ontimeupdate = () => {
                        const perc = (audio.currentTime / audio.duration) * 100;
                        pb.style.width = perc + "%";
                        curT.innerText = formatTime(audio.currentTime);
                        durT.innerText = isNaN(audio.duration) ? "0:00" : formatTime(audio.duration);
                    };
                } else {
                    audio.pause();
                    audio.currentTime = 0;
                }
            });
        }, { threshold: 0.7 });

        document.querySelectorAll('.slide').forEach(s => observer.observe(s));
    }

    function mulaiAplikasi() {
        document.getElementById('start-overlay').style.display = 'none';
        const firstAudio = document.getElementById('audio-0');
        if(firstAudio) {
            firstAudio.play();
        }
    }

    window.onload = renderPlayer;
</script>
</body>
</html>
